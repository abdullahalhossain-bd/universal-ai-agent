name: Widget UX audit patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: complete widget state and ux audit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch widget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/static/widget.js')
          s=p.read_text(encoding='utf-8')

          old='''  function clearConversation() {
    conversationId = null; conversationToken = null; merchantMode = false;
    lastMerchantIds = {}; lastMerchantMessageId = 0;
    try { localStorage.removeItem(CONV_KEY); localStorage.removeItem(TOKEN_KEY); } catch (_) {}
  }'''
          new='''  function clearConversation() {
    stopPolling();
    if (modeTimer) { clearInterval(modeTimer); modeTimer = null; }
    conversationId = null; conversationToken = null; merchantMode = false;
    lastMerchantIds = {}; lastMerchantMessageId = 0;
    try { localStorage.removeItem(CONV_KEY); localStorage.removeItem(TOKEN_KEY); } catch (_) {}
    renderMode();
  }'''
          if old in s: s=s.replace(old,new,1)

          old='''  function showWelcome() {
    var el = document.createElement("div"); el.className = "welcome";'''
          new='''  function showWelcome() {
    if (messages.querySelector('.welcome')) return;
    var el = document.createElement("div"); el.className = "welcome";'''
          if old in s: s=s.replace(old,new,1)

          old='''  function setMode(active) {
    if (active === merchantMode) return;'''
          new='''  var modeChanging = false;
  function setMode(active) {
    active = !!active;
    if (active === merchantMode && !modeChanging) return;
    if (modeChanging) return;'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('''    var previous = merchantMode;
    merchantMode = !!active;''','''    var previous = merchantMode;
    modeChanging = true;
    merchantMode = active;''',1)
          s=s.replace('''      .catch(function (e) { merchantMode = previous; renderMode(); add("merchant", (e && e.message) || "চ্যাট mode পরিবর্তন করা যায়নি। আবার চেষ্টা করুন।"); });
  }''','''      .catch(function (e) { merchantMode = previous; renderMode(); add("merchant", (e && e.message) || "চ্যাট mode পরিবর্তন করা যায়নি। আবার চেষ্টা করুন।"); })
      .finally(function () { modeChanging = false; });
  }''',1)

          s=s.replace('''  function syncMode() {
    if (!conversationId || !conversationToken) return;''','''  function syncMode() {
    if (!conversationId || !conversationToken || modeChanging) return;''',1)
          s=s.replace('''  function stopMerchantPolling() {}''','''  function stopMerchantPolling() { stopPolling(); }''',1)
          s=s.replace('''  function sendMerchant(text) {
    if (!conversationId || !conversationToken || sending) return;''','''  function sendMerchant(text) {
    if (!conversationId || !conversationToken || sending || !merchantMode) return;''',1)

          old='''.then(function (data) { typing.remove(); persist(data); add("assistant", data.message || ""); addProducts(data.products, data); startPolling(); })'''
          new='''.then(function (data) {
        typing.remove(); persist(data); add("assistant", data.message || ""); addProducts(data.products, data); startPolling();
        if (conversationId && conversationToken && !modeTimer) modeTimer = setInterval(syncMode, 5000);
      })'''
          if old in s: s=s.replace(old,new,1)

          marker='''  window.UniversalCommerceAI = window.UniversalCommerceAI || {};'''
          css='''  var auditStyle = document.createElement("style");
  auditStyle.textContent = ".panel{overscroll-behavior:contain}.messages{overscroll-behavior:contain;overflow-x:hidden}.composer textarea{min-height:42px;max-height:82px}.mode-btn,.quick,.support-action,.action,.tool{touch-action:manipulation}.msg,.welcome-card,.product{overflow-wrap:anywhere;word-break:break-word}@media(max-width:520px){.panel{position:fixed;inset:8px;width:auto;height:auto;max-height:calc(100vh - 16px);border-radius:18px}.messages{padding:12px}.composer{padding:9px}.mode-btn{min-height:38px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}";
  shadow.appendChild(auditStyle);

'''+marker
          if marker in s and 'var auditStyle = document.createElement("style")' not in s: s=s.replace(marker,css,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check app/static/widget.js
      - name: Commit and remove audit workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-widget.yml
          git add app/static/widget.js .github/workflows/audit-widget.yml
          git commit -m "fix: complete widget state and ux audit" || exit 0
          git push
