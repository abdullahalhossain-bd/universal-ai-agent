name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      AUTO_CREATE_TABLES: "false"
      GROQ_API_KEY_1: test-key
      CREDENTIAL_ENCRYPTION_KEY: 1Q5CMAJ3S3iemRmjauMWsPLeJmpY-VPO0J_9jHijTxs=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate Alembic graph
        run: |
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
      - name: Run production-equivalent Alembic migrations
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -v --ignore=tests/e2e
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Check for stray secrets
        run: |
          if git grep -nE "AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----" -- . ':(exclude).github'; then
            echo "Possible secret committed — see matches above." >&2
            exit 1
          fi

  demo-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint demo website PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=$(find 'demo website' -type f -name '*.php' -print)
          test -n "$files"
          while IFS= read -r file; do
            echo "Linting: $file"
            php -l "$file"
          done <<< "$files"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run widget browser E2E
        run: pytest -q tests/e2e/test_widget_browser.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Install browser test dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run dashboard browser E2E
        working-directory: ${{ github.workspace }}
        run: pytest -q tests/e2e/test_dashboard_browser.py

  widget-audit-patch:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'fix: complete widget state and ux audit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch widget state and UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/static/widget.js')
          s=p.read_text(encoding='utf-8')
          replacements = [
            ('''  function clearConversation() {\n    conversationId = null; conversationToken = null; merchantMode = false;\n    lastMerchantIds = {}; lastMerchantMessageId = 0;\n    try { localStorage.removeItem(CONV_KEY); localStorage.removeItem(TOKEN_KEY); } catch (_) {}\n  }''', '''  function clearConversation() {\n    stopPolling();\n    if (modeTimer) { clearInterval(modeTimer); modeTimer = null; }\n    conversationId = null; conversationToken = null; merchantMode = false;\n    lastMerchantIds = {}; lastMerchantMessageId = 0;\n    try { localStorage.removeItem(CONV_KEY); localStorage.removeItem(TOKEN_KEY); } catch (_) {}\n    renderMode();\n  }'''),
            ('''  function showWelcome() {\n    var el = document.createElement("div"); el.className = "welcome";''', '''  function showWelcome() {\n    if (messages.querySelector('.welcome')) return;\n    var el = document.createElement("div"); el.className = "welcome";'''),
            ('''  function setMode(active) {\n    if (active === merchantMode) return;''', '''  var modeChanging = false;\n  function setMode(active) {\n    active = !!active;\n    if (active === merchantMode && !modeChanging) return;\n    if (modeChanging) return;'''),
            ('''    var previous = merchantMode;\n    merchantMode = !!active;''', '''    var previous = merchantMode;\n    modeChanging = true;\n    merchantMode = active;'''),
            ('''      .catch(function (e) { merchantMode = previous; renderMode(); add("merchant", (e && e.message) || "চ্যাট mode পরিবর্তন করা যায়নি। আবার চেষ্টা করুন।"); });\n  }''', '''      .catch(function (e) { merchantMode = previous; renderMode(); add("merchant", (e && e.message) || "চ্যাট mode পরিবর্তন করা যায়নি। আবার চেষ্টা করুন।"); })\n      .finally(function () { modeChanging = false; });\n  }'''),
            ('''  function syncMode() {\n    if (!conversationId || !conversationToken) return;''', '''  function syncMode() {\n    if (!conversationId || !conversationToken || modeChanging) return;'''),
            ('''  function stopMerchantPolling() {}''', '''  function stopMerchantPolling() { stopPolling(); }'''),
            ('''  function sendMerchant(text) {\n    if (!conversationId || !conversationToken || sending) return;''', '''  function sendMerchant(text) {\n    if (!conversationId || !conversationToken || sending || !merchantMode) return;'''),
            ('''.then(function (data) { typing.remove(); persist(data); add("assistant", data.message || ""); addProducts(data.products, data); startPolling(); })''', '''.then(function (data) {\n        typing.remove(); persist(data); add("assistant", data.message || ""); addProducts(data.products, data); startPolling();\n        if (conversationId && conversationToken && !modeTimer) modeTimer = setInterval(syncMode, 5000);\n      })'''),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'expected widget pattern not found: {old[:80]!r}')
              s=s.replace(old,new,1)
          marker='''  window.UniversalCommerceAI = window.UniversalCommerceAI || {};'''
          css='''  var auditStyle = document.createElement("style");\n  auditStyle.textContent = ".panel{overscroll-behavior:contain}.messages{overscroll-behavior:contain;overflow-x:hidden}.input{min-height:42px;max-height:82px}.mode-btn,.quick,.support-action,.action,.attach,.send{touch-action:manipulation}.msg,.welcome-card,.product{overflow-wrap:anywhere;word-break:break-word}@media(max-width:520px){.panel{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;border-radius:0}.bubble{width:54px;height:54px}.mode-btn{min-height:40px}.messages{padding:12px}.composer-wrap{padding:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}";\n  shadow.appendChild(auditStyle);\n\n'''+marker
          if marker in s and 'var auditStyle = document.createElement("style")' not in s:
              s=s.replace(marker,css,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check app/static/widget.js
      - name: Commit widget patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-widget.yml
          git add app/static/widget.js .github/workflows/audit-widget.yml
          git commit -m "fix: complete widget state and ux audit" || exit 0
          git push
