name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      # Match production: schema is created only through Alembic.
      AUTO_CREATE_TABLES: "false"
      GROQ_API_KEY_1: test-key
      CREDENTIAL_ENCRYPTION_KEY: 1Q5CMAJ3S3iemRmjauMWsPLeJmpY-VPO0J_9jHijTxs=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate Alembic graph
        run: |
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1

      - name: Run production-equivalent Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -v --ignore=tests/e2e

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Check for stray secrets
        run: |
          if git grep -nE "AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----" -- . ':(exclude).github'; then
            echo "Possible secret committed — see matches above." >&2
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run widget browser E2E
        run: pytest -q tests/e2e/test_widget_browser.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build
