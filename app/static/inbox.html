<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Commerce AI — Merchant Inbox</title>
<style>
:root{--accent:#111827;--bg:#f7f7f8;--border:#e3e4e8;--text:#1f2328;--muted:#6b7280;--green:#047857;--green-bg:#ecfdf5;--red:#b3261e;--red-bg:#fdecea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.shell{max-width:1180px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px}.btn{border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.human{background:var(--green)}.btn:disabled{opacity:.5;cursor:default}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.list-head,.chat-head{padding:14px 16px;border-bottom:1px solid var(--border)}.list-head{display:flex;justify-content:space-between;align-items:center}.list{max-height:calc(100vh - 150px);overflow:auto}.conversation{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f0f1f3;background:#fff;padding:13px 14px;cursor:pointer}.conversation:hover,.conversation.active{background:#f8fafc}.conversation b{display:block;font-size:13px;margin-bottom:4px}.conversation small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;margin-top:6px;background:#f1f5f9;color:#475569}.badge.human{background:var(--green-bg);color:var(--green)}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.chat-title{min-width:0}.chat-title b{display:block;font-size:14px}.chat-title small{color:var(--muted);font-size:11px}.messages{flex:1;min-height:420px;max-height:calc(100vh - 260px);overflow:auto;padding:16px;background:#f8fafc;display:flex;flex-direction:column;gap:9px}.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--accent);color:#fff}.msg.assistant{align-self:flex-start;background:#fff;border:1px solid var(--border)}.msg.merchant{align-self:flex-start;background:var(--green-bg);color:#14532d;border:1px solid #bbf7d0}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:#fff}.composer textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:1px solid var(--border);border-radius:9px;padding:9px;font:inherit;outline:none}.empty{padding:24px;color:var(--muted);font-size:12px;text-align:center}.error{color:var(--red);font-size:12px;padding:12px;background:var(--red-bg)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.status{font-size:11px;color:var(--muted)}#auth{max-width:420px;margin:12vh auto}.auth-card{padding:24px}.auth-card h2{margin:0 0 6px;font-size:18px}.auth-card p{color:var(--muted);font-size:13px;margin:0 0 18px}.auth-card label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px}.auth-card input{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;font:inherit}.auth-card .btn{width:100%;margin-top:16px}.auth-error{display:none;margin-top:12px;padding:9px;border-radius:8px;background:var(--red-bg);color:var(--red);font-size:12px}@media(max-width:760px){.shell{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:260px}.chat{min-height:620px}.messages{min-height:360px;max-height:none}.top{align-items:flex-start}.msg{max-width:88%}}
</style>
</head>
<body>
<div id="auth" class="shell">
  <section class="card auth-card">
    <h2>Merchant Inbox</h2>
    <p>Sign in with your merchant account. Your public <code>pk_live</code> widget key cannot access this inbox.</p>
    <form id="login-form">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" id="login-btn" type="submit">Sign in</button>
      <div id="auth-error" class="auth-error"></div>
    </form>
  </section>
</div>
<div id="app" class="shell" style="display:none">
  <div class="top"><div><h1>Merchant Inbox</h1><div class="sub" id="store-label">Merchant conversation management</div></div><div class="actions"><button class="btn secondary" id="dashboard" type="button">Dashboard</button><button class="btn secondary" id="logout" type="button">Log out</button></div></div>
  <div class="layout">
    <section class="card"><div class="list-head"><b>Conversations</b><button class="btn secondary" id="refresh" type="button">Refresh</button></div><div class="list" id="conversation-list"><div class="empty">Loading…</div></div></section>
    <section class="card chat"><div class="chat-head"><div class="chat-title"><b id="chat-title">Select a conversation</b><small id="chat-meta">—</small></div><div class="actions"><span class="status" id="mode-status"></span><button class="btn human" id="takeover" disabled type="button">Take over</button><button class="btn secondary" id="resume" disabled type="button">Resume AI</button></div></div><div class="messages" id="messages"><div class="empty">Choose a customer conversation from the left.</div></div><div class="composer"><textarea id="reply" maxlength="5000" placeholder="Take over first to reply directly." disabled></textarea><button class="btn" id="send" disabled type="button">Send</button></div></section>
  </div>
</div>
<script>
(function(){
  "use strict";
  var API_BASE=location.origin, TOKEN_KEY="ucai_merchant_access_token", STORE_KEY="ucai_merchant_store";
  var token=sessionStorage.getItem(TOKEN_KEY)||"";
  var selected=null, timer=null, loading=false, cached=[];
  var auth=document.getElementById("auth"), app=document.getElementById("app");
  var list=document.getElementById("conversation-list"), messages=document.getElementById("messages"), title=document.getElementById("chat-title"), meta=document.getElementById("chat-meta"), status=document.getElementById("mode-status"), reply=document.getElementById("reply"), send=document.getElementById("send"), takeover=document.getElementById("takeover"), resume=document.getElementById("resume");

  function api(path,opts){
    opts=opts||{};
    var headers=Object.assign({"content-type":"application/json"},opts.headers||{});
    if(token) headers.authorization="Bearer "+token;
    return fetch(API_BASE+path,{method:opts.method||"GET",headers:headers,body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){
      return r.json().catch(function(){return{}}).then(function(d){
        if(r.status===401){sessionStorage.removeItem(TOKEN_KEY);token="";showAuth("Session expired. Please sign in again.");}
        if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));
        return d;
      });
    });
  }
  function showAuth(error){
    if(timer){clearInterval(timer);timer=null;}
    auth.style.display="block";app.style.display="none";
    var e=document.getElementById("auth-error");e.textContent=error||"";e.style.display=error?"block":"none";
  }
  function showApp(){auth.style.display="none";app.style.display="block";loadList();if(!timer)timer=setInterval(poll,5000)}
  function appendEmpty(parent,text){var el=document.createElement("div");el.className="empty";el.textContent=text;parent.appendChild(el)}
  function renderList(items){
    list.textContent="";
    if(!Array.isArray(items)||!items.length){appendEmpty(list,"No customer conversations yet.");return}
    items.forEach(function(item){
      var b=document.createElement("button");b.className="conversation"+(selected&&selected.conversation_id===item.conversation_id?" active":"");b.type="button";
      var label=document.createElement("b");label.textContent=item.visitor_id||item.conversation_id;
      var small=document.createElement("small");small.textContent=item.last_message&&item.last_message.content?String(item.last_message.content):"No messages yet";
      var badge=document.createElement("span");badge.className="badge"+(item.mode==="human"?" human":"");badge.textContent=item.mode==="human"?"Human":"AI";
      b.appendChild(label);b.appendChild(small);b.appendChild(badge);b.onclick=function(){openConversation(item.conversation_id)};list.appendChild(b);
    });
  }
  function renderListCache(){renderList(cached)}
  function renderMessages(data){
    messages.textContent="";
    if(!data||!Array.isArray(data.messages)||!data.messages.length){appendEmpty(messages,"No messages yet.");return}
    data.messages.forEach(function(m){var el=document.createElement("div");el.className="msg "+(m.role==="user"?"user":m.role==="merchant"?"merchant":"assistant");el.textContent=m.content==null?"":String(m.content);messages.appendChild(el)});messages.scrollTop=messages.scrollHeight;
  }
  function setControls(mode){var human=mode==="human";status.textContent=human?"Human mode — AI replies paused":"AI mode";takeover.disabled=human||!selected;resume.disabled=!human||!selected;reply.disabled=!selected||!human;send.disabled=!selected||!human||loading;reply.placeholder=human?"Reply to customer…":"Take over first to reply directly."}
  function openConversation(id){selected={conversation_id:id};loadConversation()}
  function loadConversation(){if(!selected)return;api("/v1/messages/conversations/"+encodeURIComponent(selected.conversation_id)).then(function(data){selected=data;title.textContent="Visitor: "+(data.visitor_id||"anonymous");meta.textContent=data.conversation_id;setControls(data.mode||"ai");renderMessages(data);renderListCache()}).catch(function(e){messages.textContent="";var er=document.createElement("div");er.className="error";er.textContent=e.message;messages.appendChild(er)})}
  function loadList(){if(!token)return;api("/v1/messages/conversations").then(function(data){cached=Array.isArray(data)?data:[];renderList(cached);var active=cached.find(function(x){return selected&&x.conversation_id===selected.conversation_id});if(active)loadConversation()}).catch(function(e){list.textContent="";var er=document.createElement("div");er.className="error";er.textContent=e.message;list.appendChild(er)})}
  function changeMode(mode){if(!selected)return;api("/v1/messages/conversations/"+encodeURIComponent(selected.conversation_id)+"/mode",{method:"POST",body:{mode:mode}}).then(function(){loadConversation();loadList()}).catch(function(e){alert(e.message)})}
  function sendReply(){var text=reply.value.trim();if(!text||!selected||loading)return;loading=true;setControls("human");api("/v1/messages/conversations/"+encodeURIComponent(selected.conversation_id)+"/reply",{method:"POST",body:{message:text}}).then(function(){reply.value="";loadConversation();loadList()}).catch(function(e){alert(e.message)}).finally(function(){loading=false;if(selected)setControls(selected.mode||"ai")})}
  document.getElementById("login-form").addEventListener("submit",function(e){e.preventDefault();var btn=document.getElementById("login-btn");var err=document.getElementById("auth-error");err.style.display="none";btn.disabled=true;fetch(API_BASE+"/v1/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d})}).then(function(data){token=data.access_token;sessionStorage.setItem(TOKEN_KEY,token);if(data.store){sessionStorage.setItem(STORE_KEY,JSON.stringify(data.store));document.getElementById("store-label").textContent="Store: "+(data.store.name||data.store.id)};showApp()}).catch(function(e){err.textContent=e.message;err.style.display="block"}).finally(function(){btn.disabled=false})});
  send.onclick=sendReply;reply.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply()}});takeover.onclick=function(){changeMode("human")};resume.onclick=function(){changeMode("ai")};document.getElementById("refresh").onclick=loadList;document.getElementById("dashboard").onclick=function(){location.href="/admin"};document.getElementById("logout").onclick=function(){if(token){fetch(API_BASE+"/v1/auth/logout",{method:"POST",headers:{authorization:"Bearer "+token}}).catch(function(){})}sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(STORE_KEY);token="";showAuth()};
  function poll(){if(token){if(selected)loadConversation();else loadList()}}
  try{var savedStore=JSON.parse(sessionStorage.getItem(STORE_KEY)||"null");if(savedStore)document.getElementById("store-label").textContent="Store: "+(savedStore.name||savedStore.id)}catch(_){ }
  if(token)showApp();else showAuth();
  window.addEventListener("beforeunload",function(){if(timer)clearInterval(timer)});
})();
</script>
</body>
</html>
