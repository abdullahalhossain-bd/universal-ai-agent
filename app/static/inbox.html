<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Commerce AI — Merchant Inbox</title>
<style>
:root{--accent:#111827;--bg:#f6f7f9;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--green:#047857;--green-bg:#ecfdf5;--red:#b91c1c;--red-bg:#fef2f2;--amber:#92400e;--amber-bg:#fffbeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.shell{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:20px}.sub,.status{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:8px 11px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.green{background:var(--green)}.btn.danger{background:var(--red)}.btn:disabled{opacity:.5;cursor:default}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600}.tab.active{background:var(--accent);color:#fff}.layout{display:grid;grid-template-columns:310px minmax(430px,1fr) 360px;gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}.search{padding:10px;border-bottom:1px solid var(--border)}.search input,.field input,.field select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font:inherit}.list{max-height:calc(100vh - 205px);overflow:auto}.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f0f1f3;background:#fff;padding:12px;cursor:pointer}.row:hover,.row.active{background:#f8fafc}.row b{font-size:13px;display:block}.row small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;background:#f1f5f9;color:#475569;margin-top:6px}.pill.unread{background:#fee2e2;color:#991b1b}.pill.green{background:var(--green-bg);color:var(--green)}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 130px)}.chat-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.messages{flex:1;min-height:420px;max-height:calc(100vh - 250px);overflow:auto;padding:15px;background:#f8fafc;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--accent);color:#fff}.msg.assistant{align-self:flex-start;background:#fff;border:1px solid var(--border)}.msg.merchant{align-self:flex-start;background:var(--green-bg);border:1px solid #bbf7d0}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid var(--border)}textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:1px solid var(--border);border-radius:8px;padding:9px;font:inherit}.profile{min-height:calc(100vh - 130px);overflow:auto}.profile-body{padding:14px}.id{font:10px ui-monospace,monospace;color:#64748b;word-break:break-all}.field{margin:10px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px}.section{font-size:12px;font-weight:700;margin:18px 0 8px}.chip{border:1px solid var(--border);border-radius:9px;padding:8px;margin-bottom:7px;background:#fafafa}.chip b{font-size:11px}.chip div{font-size:11px;color:#475569;word-break:break-all;margin-top:3px}.history{border-left:2px solid #e5e7eb;padding-left:10px}.history-item{padding-bottom:11px}.history-item b{font-size:11px}.history-item div{font-size:10px;color:var(--muted);line-height:1.4}.box{padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:10px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.error{padding:10px;color:var(--red);background:var(--red-bg);font-size:12px}.more{width:100%;margin-top:8px}.hide{display:none}.auth{max-width:420px;margin:12vh auto}.auth-card{padding:24px}.auth-card h2{margin:0 0 5px}.auth-card p{font-size:13px;color:var(--muted)}.auth-card label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px}.auth-card input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px}.auth-card button{width:100%;margin-top:15px}.auth-error{display:none;margin-top:10px;padding:9px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:12px}@media(max-width:1100px){.layout{grid-template-columns:280px minmax(400px,1fr)}.profile{grid-column:1/-1;min-height:auto}}@media(max-width:760px){.shell{padding:10px}.layout{grid-template-columns:1fr}.list{max-height:280px}.chat{min-height:620px}.messages{max-height:none}.profile{grid-column:auto}.msg{max-width:88%}}
</style>
</head>
<body>
<div id="auth" class="shell auth"><section class="card auth-card"><h2>Merchant Inbox</h2><p>Merchant-only session. Public widget keys cannot access Customer management.</p><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" id="loginBtn">Sign in</button><div id="authError" class="auth-error"></div></form></section></div>
<div id="app" class="shell hide">
<div class="top"><div><h1>Merchant Inbox</h1><div id="store" class="sub">Customer and conversation management</div></div><div class="actions"><button class="btn secondary" id="dashboard">Dashboard</button><button class="btn secondary" id="logout">Log out</button></div></div>
<div class="tabs"><button class="tab active" id="inboxTab">Inbox</button><button class="tab" id="customersTab">Customers</button></div>
<div class="layout">
<section class="card"><div class="head"><b id="leftTitle">Conversations</b><button class="btn secondary" id="refresh">Refresh</button></div><div class="search"><input id="search" placeholder="Search customer or visitor"></div><div id="leftList" class="list"></div><button class="btn secondary more" id="loadMore">Load more</button></section>
<section class="card chat"><div class="chat-head"><div><b id="chatTitle">Select a conversation</b><div id="chatMeta" class="sub">—</div></div><div class="actions"><span id="mode" class="status"></span><button class="btn green" id="takeover" disabled>Take over</button><button class="btn secondary" id="resume" disabled>Resume AI</button><button class="btn secondary" id="resolve" disabled>Resolve</button><button class="btn secondary" id="archive" disabled>Archive</button></div></div><div id="messages" class="messages"><div class="empty">Choose a conversation.</div></div><div class="composer"><textarea id="reply" maxlength="5000" placeholder="Take over first to reply directly." disabled></textarea><button class="btn" id="send" disabled>Send</button></div></section>
<aside class="card profile"><div class="head"><b>Customer profile</b><span id="profileStatus" class="status"></span></div><div id="profile" class="profile-body"><div class="empty">Select a customer.</div></div></aside>
</div></div>
<script>
(function(){"use strict";
var API=location.origin,CSRF="ucai_merchant_csrf",selected=null,customerSelected=null,mode="inbox",cursor=null,customerCursor=null,pollTimer=null,loading=false;
var $=function(id){return document.getElementById(id)};
function csrf(){var p=CSRF+"=",a=document.cookie.split(";");for(var i=0;i<a.length;i++){var x=a[i].trim();if(x.indexOf(p)===0)return decodeURIComponent(x.slice(p.length))}return""}
function api(path,opt){opt=opt||{};var m=(opt.method||"GET").toUpperCase(),h={"content-type":"application/json"};if(m!=="GET"&&m!=="HEAD"){var c=csrf();if(c)h["x-csrf-token"]=c}return fetch(API+path,{method:m,headers:h,credentials:"same-origin",body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(r.status===401){showAuth("Session expired. Sign in again.")}if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d})})}
function txt(p,t,v,c){var e=document.createElement(t);if(c)e.className=c;e.textContent=v==null?"":String(v);p.appendChild(e);return e}
function empty(p,v){p.textContent="";txt(p,"div",v,"empty")}
function date(v){if(!v)return"—";try{return new Date(v).toLocaleString()}catch(e){return String(v)}}
function label(i,v){i=i||{};return i.name||i.email||i.phone||v||"Anonymous customer"}
function showAuth(err){if(pollTimer){clearInterval(pollTimer);pollTimer=null}$('auth').classList.remove('hide');$('app').classList.add('hide');$('authError').textContent=err||"";$('authError').style.display=err?"block":"none"}
function showApp(data){$('auth').classList.add('hide');$('app').classList.remove('hide');if(data&&data.store)$('store').textContent="Store: "+(data.store.name||data.store.id);loadInbox(true);if(!pollTimer)pollTimer=setInterval(function(){mode==='inbox'?loadInbox(false):loadCustomers(false)},5000)}
function renderConversationRows(items,append){var box=$('leftList');if(!append)box.textContent="";if(!items.length&&!append){empty(box,"No conversations found.");return}items.forEach(function(x){var b=document.createElement('button');b.className='row'+(selected&&selected.conversation_id===x.conversation_id?' active':'');b.type='button';txt(b,'b',label(x.identity,x.visitor_id));txt(b,'small',x.last_message&&x.last_message.content?x.last_message.content:'No messages yet');txt(b,'small',x.status+(x.unread?' · UNREAD':''));if(x.unread)txt(b,'span','Unread','pill unread');else txt(b,'span',x.status==='resolved'?'Resolved':x.status==='archived'?'Archived':'Open','pill'+(x.status==='resolved'?' green':''));b.onclick=function(){openConversation(x.conversation_id)};box.appendChild(b)})}
function loadInbox(reset){if(reset)cursor=null;var q='/v1/customer-management/conversations?limit=40'+(cursor?'&cursor='+encodeURIComponent(cursor):'');var s=$('search').value.trim();if(s)q+='&search='+encodeURIComponent(s);api(q).then(function(d){renderConversationRows(d.items||[],!reset);cursor=d.next_cursor||null;$('loadMore').disabled=!cursor;if(reset&&selected)openConversation(selected.conversation_id)}).catch(function(e){empty($('leftList'),e.message)})}
function loadCustomers(reset){if(reset)customerCursor=null;var q='/v1/customer-management/customers?limit=40'+(customerCursor?'&cursor='+encodeURIComponent(customerCursor):'');var s=$('search').value.trim();if(s)q+='&search='+encodeURIComponent(s);api(q).then(function(d){renderCustomerRows(d.items||[],!reset);customerCursor=d.next_cursor||null;$('loadMore').disabled=!customerCursor}).catch(function(e){empty($('leftList'),e.message)})}
function renderCustomerRows(items,append){var box=$('leftList');if(!append)box.textContent="";if(!items.length&&!append){empty(box,'No customers found.');return}items.forEach(function(c){var b=document.createElement('button');b.className='row'+(customerSelected===c.customer_id?' active':'');b.type='button';txt(b,'b',c.name||c.email||c.phone||'Unnamed customer');txt(b,'small',c.email||c.phone||c.customer_id);txt(b,'small','Last seen: '+date(c.last_seen_at));if(c.anonymized_at)txt(b,'span','Anonymized','pill');b.onclick=function(){customerSelected=c.customer_id;loadCustomer(c.customer_id)};box.appendChild(b)})}
function openConversation(id){selected={conversation_id:id};api('/v1/messages/conversations/'+encodeURIComponent(id)).then(function(d){selected=d;$('chatTitle').textContent=label(d.identity,d.visitor_id);$('chatMeta').textContent='Conversation: '+d.conversation_id+' · '+(d.status||'open');setModeButtons(d.mode||'ai',d.status||'open');renderMessages(d.messages||[]);if(d.customer_id)loadCustomer(d.customer_id);else empty($('profile'),'This conversation has no Customer entity yet.');markRead(id);}).catch(function(e){empty($('messages'),e.message)})}
function renderMessages(items){var box=$('messages');box.textContent="";if(!items.length){empty(box,'No messages yet.');return}items.forEach(function(m){var e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':m.role==='merchant'?'merchant':'assistant');e.textContent=m.content==null?'':String(m.content);box.appendChild(e)});box.scrollTop=box.scrollHeight}
function setModeButtons(m,s){var human=m==='human';$('mode').textContent=human?'Human mode — AI paused':'AI mode';$('takeover').disabled=human||!selected||s==='archived';$('resume').disabled=!human||!selected||s==='archived';$('reply').disabled=!human||!selected||s==='archived';$('send').disabled=!human||!selected||s==='archived';$('resolve').disabled=!selected||s==='archived'||s==='resolved';$('archive').disabled=!selected||s==='archived';}
function markRead(id){api('/v1/customer-management/conversations/'+encodeURIComponent(id)+'/read',{method:'POST'}).catch(function(){})}
function changeMode(m){if(!selected)return;api('/v1/messages/conversations/'+encodeURIComponent(selected.conversation_id)+'/mode',{method:'POST',body:{mode:m}}).then(function(){openConversation(selected.conversation_id);loadInbox(true)}).catch(function(e){alert(e.message)})}
function changeStatus(s){if(!selected)return;api('/v1/customer-management/conversations/'+encodeURIComponent(selected.conversation_id)+'/status',{method:'POST',body:{status:s}}).then(function(){openConversation(selected.conversation_id);loadInbox(true)}).catch(function(e){alert(e.message)})}
function sendReply(){var v=$('reply').value.trim();if(!v||!selected||loading)return;loading=true;api('/v1/messages/conversations/'+encodeURIComponent(selected.conversation_id)+'/reply',{method:'POST',body:{message:v}}).then(function(){$('reply').value='';openConversation(selected.conversation_id);loadInbox(true)}).catch(function(e){alert(e.message)}).finally(function(){loading=false})}
function loadCustomer(id){customerSelected=id;$('profileStatus').textContent='Loading…';api('/v1/customer-management/customers/'+encodeURIComponent(id)).then(renderCustomer).catch(function(e){empty($('profile'),e.message);$('profileStatus').textContent=''})}
function renderCustomer(data){var p=$('profile');p.textContent="";var c=data.customer||{};$('profileStatus').textContent='';txt(p,'div',c.customer_id,'id');[['Name',c.name||'—'],['Email',c.email||'—'],['Phone',c.phone||'—'],['First seen',date(c.first_seen_at)],['Last seen',date(c.last_seen_at)]].forEach(function(x){var f=document.createElement('div');f.className='field';txt(f,'label',x[0]);txt(f,'div',x[1]);p.appendChild(f)});
section(p,'Linked identities');(data.identities||[]).forEach(function(i){var ch=document.createElement('div');ch.className='chip';txt(ch,'b',i.type);txt(ch,'div',i.value);var ub=document.createElement('button');ub.className='btn danger';ub.type='button';ub.textContent='Unlink';ub.style.marginTop='6px';ub.onclick=function(){if(confirm('Unlink this identity?'))api('/v1/customer-management/customers/'+encodeURIComponent(c.customer_id)+'/identities/'+encodeURIComponent(i.id),{method:'DELETE'}).then(function(){loadCustomer(c.customer_id)}).catch(function(e){alert(e.message)})};ch.appendChild(ub);p.appendChild(ch)});
var add=document.createElement('div');add.className='box';txt(add,'b','Secure manual linking');txt(add,'div','Merchant-only. No automatic email/phone linking.','status');var sel=document.createElement('select');txt(sel,'option','Email');txt(sel,'option','Phone');sel.firstChild.value='email';sel.lastChild.value='phone';add.appendChild(sel);var inp=document.createElement('input');inp.placeholder='Email or phone';inp.style.width='100%';inp.style.padding='9px';inp.style.marginTop='7px';inp.style.border='1px solid var(--border)';inp.style.borderRadius='8px';add.appendChild(inp);var lb=document.createElement('button');lb.className='btn';lb.type='button';lb.textContent='Link identity';lb.style.marginTop='7px';lb.onclick=function(){api('/v1/customer-management/customers/'+encodeURIComponent(c.customer_id)+'/identities/link',{method:'POST',body:{identity_type:sel.value,identity_value:inp.value.trim()}}).then(function(){loadCustomer(c.customer_id)}).catch(function(e){alert(e.message)})};add.appendChild(lb);p.appendChild(add);
section(p,'Conversations');(data.conversations||[]).forEach(function(v){var b=document.createElement('button');b.className='row';b.type='button';txt(b,'b',v.conversation_id);txt(b,'small',v.status+' · '+date(v.updated_at));b.onclick=function(){mode='inbox';openConversation(v.conversation_id)};p.appendChild(b)});if(!(data.conversations||[]).length)txt(p,'div','No conversations.','status');
section(p,'Identity history');var h=document.createElement('div');h.className='history';(data.identity_history||[]).forEach(function(x){var it=document.createElement('div');it.className='history-item';txt(it,'b',x.action.replace(/_/g,' '));txt(it,'div',(x.identity_type?x.identity_type+': '+x.identity_value+' · ':'')+date(x.created_at));h.appendChild(it)});if(!(data.identity_history||[]).length)txt(h,'div','No identity changes.','status');p.appendChild(h);
section(p,'Audit log');var a=document.createElement('div');a.className='history';(data.audit_log||[]).forEach(function(x){var it=document.createElement('div');it.className='history-item';txt(it,'b',x.action.replace(/_/g,' '));txt(it,'div',date(x.created_at)+' · '+(x.actor_type||'system'));a.appendChild(it)});if(!(data.audit_log||[]).length)txt(a,'div','No audit events.','status');p.appendChild(a);
var actions=document.createElement('div');actions.className='actions';var an=document.createElement('button');an.className='btn danger';an.textContent='Anonymize customer';an.onclick=function(){if(confirm('Anonymize this customer and remove trusted identities?'))api('/v1/customer-management/customers/'+encodeURIComponent(c.customer_id)+'/anonymize',{method:'POST'}).then(function(){loadCustomer(c.customer_id);mode==='customers'?loadCustomers(true):loadInbox(true)}).catch(function(e){alert(e.message)})};actions.appendChild(an);p.appendChild(actions);
}
function section(p,t){txt(p,'div',t,'section')}
$('login').onsubmit=function(e){e.preventDefault();var b=$('loginBtn');b.disabled=true;fetch(API+'/v1/auth/inbox/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.detail||'Login failed');return d})}).then(showApp).catch(function(e){$('authError').textContent=e.message;$('authError').style.display='block'}).finally(function(){b.disabled=false})};
$('inboxTab').onclick=function(){mode='inbox';$('inboxTab').classList.add('active');$('customersTab').classList.remove('active');$('leftTitle').textContent='Conversations';loadInbox(true)};$('customersTab').onclick=function(){mode='customers';$('customersTab').classList.add('active');$('inboxTab').classList.remove('active');$('leftTitle').textContent='Customers';loadCustomers(true)};$('refresh').onclick=function(){mode==='inbox'?loadInbox(true):loadCustomers(true)};$('loadMore').onclick=function(){mode==='inbox'?loadInbox(false):loadCustomers(false)};$('search').oninput=function(){clearTimeout(window._searchTimer);window._searchTimer=setTimeout(function(){mode==='inbox'?loadInbox(true):loadCustomers(true)},250)};$('takeover').onclick=function(){changeMode('human')};$('resume').onclick=function(){changeMode('ai')};$('resolve').onclick=function(){changeStatus('resolved')};$('archive').onclick=function(){changeStatus('archived')};$('send').onclick=sendReply;$('reply').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply()}};$('dashboard').onclick=function(){location.href='/admin'};$('logout').onclick=function(){api('/v1/auth/inbox/logout',{method:'POST'}).catch(function(){}).finally(function(){showAuth()})};
fetch(API+'/v1/auth/inbox/me',{credentials:'same-origin'}).then(function(r){if(!r.ok)throw new Error('not authenticated');return r.json()}).then(showApp).catch(function(){showAuth()});window.addEventListener('beforeunload',function(){if(pollTimer)clearInterval(pollTimer)});
})();
</script>
</body>
</html>
