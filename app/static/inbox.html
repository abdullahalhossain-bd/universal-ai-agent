<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Commerce AI — Merchant Inbox</title>
<style>
:root{--accent:#111827;--bg:#f7f7f8;--border:#e3e4e8;--text:#1f2328;--muted:#6b7280;--green:#047857;--green-bg:#ecfdf5;--red:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.shell{max-width:1180px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px}.btn{border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.human{background:var(--green)}.btn:disabled{opacity:.5;cursor:default}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.list-head,.chat-head{padding:14px 16px;border-bottom:1px solid var(--border)}.list-head{display:flex;justify-content:space-between;align-items:center}.list{max-height:calc(100vh - 150px);overflow:auto}.conversation{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f0f1f3;background:#fff;padding:13px 14px;cursor:pointer}.conversation:hover,.conversation.active{background:#f8fafc}.conversation b{display:block;font-size:13px;margin-bottom:4px}.conversation small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;margin-top:6px;background:#f1f5f9;color:#475569}.badge.human{background:var(--green-bg);color:var(--green)}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.chat-title{min-width:0}.chat-title b{display:block;font-size:14px}.chat-title small{color:var(--muted);font-size:11px}.messages{flex:1;min-height:420px;max-height:calc(100vh - 260px);overflow:auto;padding:16px;background:#f8fafc;display:flex;flex-direction:column;gap:9px}.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--accent);color:#fff}.msg.assistant{align-self:flex-start;background:#fff;border:1px solid var(--border)}.msg.merchant{align-self:flex-start;background:var(--green-bg);color:#14532d;border:1px solid #bbf7d0}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:#fff}.composer textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:1px solid var(--border);border-radius:9px;padding:9px;font:inherit;outline:none}.empty{padding:24px;color:var(--muted);font-size:12px;text-align:center}.error{color:var(--red);font-size:12px;padding:12px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.status{font-size:11px;color:var(--muted)}@media(max-width:760px){.shell{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:260px}.chat{min-height:620px}.messages{min-height:360px;max-height:none}.top{align-items:flex-start}.msg{max-width:88%}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div><h1>Merchant Inbox</h1><div class="sub" id="store-label">Connect your store API key to manage conversations.</div></div><div class="actions"><button class="btn secondary" id="dashboard">Dashboard</button><button class="btn secondary" id="logout">Log out</button></div></div>
  <div class="layout">
    <section class="card"><div class="list-head"><b>Conversations</b><button class="btn secondary" id="refresh">Refresh</button></div><div class="list" id="conversation-list"><div class="empty">Loading…</div></div></section>
    <section class="card chat"><div class="chat-head"><div class="chat-title"><b id="chat-title">Select a conversation</b><small id="chat-meta">—</small></div><div class="actions"><span class="status" id="mode-status"></span><button class="btn human" id="takeover" disabled>Take over</button><button class="btn secondary" id="resume" disabled>Resume AI</button></div></div><div class="messages" id="messages"><div class="empty">Choose a customer conversation from the left.</div></div><div class="composer"><textarea id="reply" maxlength="5000" placeholder="Reply to customer…" disabled></textarea><button class="btn" id="send" disabled>Send</button></div></section>
  </div>
</div>
<script>
(function(){
  "use strict";
  var API_BASE=location.origin, STORAGE="ucai_dashboard_state";
  var state={}; try{state=JSON.parse(localStorage.getItem(STORAGE)||"{}")}catch(_){state={}};
  var apiKey=state.apiKey||"";
  var selected=null, timer=null, loading=false;
  var list=document.getElementById("conversation-list"), messages=document.getElementById("messages"), title=document.getElementById("chat-title"), meta=document.getElementById("chat-meta"), status=document.getElementById("mode-status"), reply=document.getElementById("reply"), send=document.getElementById("send"), takeover=document.getElementById("takeover"), resume=document.getElementById("resume");
  function api(path,opts){opts=opts||{};var headers=Object.assign({"content-type":"application/json","x-api-key":apiKey},opts.headers||{});return fetch(API_BASE+path,{method:opts.method||"GET",headers:headers,body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d})})}
  function escapeText(v){return v==null?"":String(v)}
  function renderList(items){list.innerHTML="";if(!Array.isArray(items)||!items.length){list.innerHTML='<div class="empty">No customer conversations yet.</div>';return}items.forEach(function(item){var b=document.createElement("button");b.className="conversation"+(selected&&selected.conversation_id===item.conversation_id?" active":"");b.type="button";var label=item.visitor_id||item.conversation_id;var last=item.last_message&&item.last_message.content?item.last_message.content:"No messages yet";b.innerHTML="<b>"+escapeText(label)+"</b><small>"+escapeText(last)+"</small><span class=\"badge "+(item.mode==="human"?"human":"")+">"+(item.mode==="human"?"Human":"AI")+"</span>";b.onclick=function(){openConversation(item.conversation_id)};list.appendChild(b)})}
  function renderMessages(data){messages.innerHTML="";if(!data||!Array.isArray(data.messages)||!data.messages.length){messages.innerHTML='<div class="empty">No messages yet.</div>';return}data.messages.forEach(function(m){var el=document.createElement("div");el.className="msg "+(m.role==="user"?"user":m.role==="merchant"?"merchant":"assistant");el.textContent=escapeText(m.content);messages.appendChild(el)});messages.scrollTop=messages.scrollHeight}
  function setControls(mode){var human=mode==="human";status.textContent=human?"Human mode — AI replies paused":"AI mode";takeover.disabled=human||!selected;resume.disabled=!human||!selected;reply.disabled=!selected;send.disabled=!selected||loading;reply.placeholder=human?"Reply to customer…":"Take over first to reply directly."}
  function openConversation(id){selected={conversation_id:id};loadConversation()}
  function loadConversation(){if(!selected)return;api("/v1/messages/conversations/"+encodeURIComponent(selected.conversation_id)).then(function(data){selected=data;title.textContent="Visitor: "+(data.visitor_id||"anonymous");meta.textContent=data.conversation_id;setControls(data.mode||"ai");renderMessages(data);renderListCache()}).catch(function(e){messages.innerHTML='<div class="error">'+escapeText(e.message)+'</div>'})}
  var cached=[];function renderListCache(){renderList(cached)}
  function loadList(){if(!apiKey){list.innerHTML='<div class="error">No API key found. Open the merchant dashboard first.</div>';return}api("/v1/messages/conversations").then(function(data){cached=Array.isArray(data)?data:[];renderList(cached);var active=cached.find(function(x){return selected&&x.conversation_id===selected.conversation_id});if(active)loadConversation()}).catch(function(e){list.innerHTML='<div class="error">'+escapeText(e.message)+'</div>'})}
  function changeMode(mode){if(!selected)return;api("/v1/messages/conversations/"+encodeURIComponent(selected.conversation_id)+"/mode",{method:"POST",body:{mode:mode}}).then(function(){loadConversation();loadList()}).catch(function(e){alert(e.message)})}
  function sendReply(){var text=reply.value.trim();if(!text||!selected||loading)return;loading=true;send.disabled=true;api("/v1/messages/conversations/"+encodeURIComponent(selected.conversation_id)+"/reply",{method:"POST",body:{message:text}}).then(function(){reply.value="";loadConversation();loadList()}).catch(function(e){alert(e.message)}).finally(function(){loading=false;setControls(selected&&selected.mode||"ai")})}
  send.onclick=sendReply;reply.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply()}});takeover.onclick=function(){changeMode("human")};resume.onclick=function(){changeMode("ai")};document.getElementById("refresh").onclick=loadList;document.getElementById("dashboard").onclick=function(){location.href="/admin"};document.getElementById("logout").onclick=function(){try{localStorage.removeItem(STORAGE)}catch(_){}location.href="/admin"};
  function poll(){if(selected)loadConversation();else loadList()};
  document.getElementById("store-label").textContent=state.storeName?"Store: "+state.storeName:"Merchant conversation management";
  if(!apiKey){list.innerHTML='<div class="error">No API key found. Please open /admin and continue with your store API key.</div>'}else{loadList();timer=setInterval(poll,5000)}
  window.addEventListener("beforeunload",function(){if(timer)clearInterval(timer)});
})();
</script>
</body>
</html>
