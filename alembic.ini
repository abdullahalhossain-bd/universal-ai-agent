[alembic]
script_location = alembic

# Timestamped, sortable filenames make `ls alembic/versions` readable
# and merges obvious in `git log`/diff.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally NOT set here — alembic/env.py reads
# it from app.core.config.settings (the same DATABASE_URL the app
# itself uses), so there is exactly one place the connection string
# is configured. This also means CREDENTIAL_ENCRYPTION_KEY etc. only
# need to be set once in the deploy environment, not duplicated here.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
